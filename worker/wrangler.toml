#:schema https://cloudflare.com/workers/wrangler-schema.json
# Cloudflare Worker: daily harness (replaces GitHub Actions harness-daily.yml).
# Runs 4 x per day on cron, re-publishes data/index.json back to GitHub,
# which triggers a Cloudflare Pages deploy via the Git integration.

name = "tech-dashboard-harness"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Cron: every hour (24 runs/day = ~720/month).
# Pages builds only fire when data/index.json actually changes (worker no-ops otherwise),
# so realistic Pages build count stays well under the Free 500 builds/month cap.
[triggers]
crons = ["0 * * * *"]

# Summary cache (replaces data/_summary-cache.json).
# Create with: wrangler kv namespace create SUMMARY_CACHE
[[kv_namespaces]]
binding = "SUMMARY_CACHE"
id = "6d67debb991742efadfec473a121f5fc"

[vars]
GITHUB_OWNER = "himiyosh"
GITHUB_REPO = "tech-dashboard"
GITHUB_BRANCH = "main"
# LL-031: opus-4.7 long-form generation does not fit in Cloudflare Worker
# wall-time (~30s). Sonnet 4.6 is 3-5x faster with comparable summary quality
# and stays well within budget. Switch to opus only when premium quality is
# required (see R-007).
SUMMARIZE_MODEL = "claude-sonnet-4.6"
# 2026-05-15: subrequest 問題は PR #38/#40/#41/#45 で解消したが、Worker
# CPU 時間 30s 上限を summarize=1 でも超過する (tail: "Worker exceeded
# CPU time limit"). 長文 bilingual JSON のパースと publishHistoryFiles の
# 重い stats/archive 処理が合算するため。Worker は collection + publish に
# 専念させ、要約は `npm run resummarize` (ローカル, CPU 制約なし) で行う
# 方針。LL-031/LL-037 参照。
SUMMARIZE_MAX_NEW = "0"
SUMMARIZE_CONCURRENCY = "2"
# 25s: sonnet long-form bilingual JSON output (max_tokens=2400) needs
# 12-20s typically; 15s killed legitimate responses. See LL-034.
SUMMARIZE_TIMEOUT_MS = "25000"
# Queue split feature flag. "0" = legacy behaviour (no enqueue).
# "1" = after each cron, enqueue up to ENQUEUE_MAX_NEW entries that lack a
# real cache hit. Requires the SUMMARY_QUEUE producer binding to exist
# (see commented [[queues.producers]] block below) and the
# tech-dashboard-summarizer Worker to be deployed.
# 2026-05-15: Queue 経由 backfill は KV cache.v1 blob (~5MB) の read/write
# が Copilot 応答時間予算を圧迫し全件 AbortError。一時的に enqueue を停止し、
# ローカル resummarize を継続。本格復旧は per-URL KV キー化 (A 案) 後に再開。
ENABLE_SUMMARY_QUEUE = "0"
ENQUEUE_MAX_NEW = "1000"

# Secrets (set via `wrangler secret put`):
#   - COPILOT_PAT    Classic PAT with Copilot Enterprise access
#   - GH_TOKEN       Fine-grained PAT with "Contents: Write" on this repo

# Optional: Queue producer for the split summarizer Worker (LL-037 mid-term).
# Activate by:
#   1. `wrangler queues create tech-dashboard-summary`
#   2. `wrangler queues create tech-dashboard-summary-dlq`
#   3. Uncomment the binding below + redeploy
#   4. Deploy worker-summarizer (cd ../worker-summarizer && wrangler deploy)
#   5. Set `ENABLE_SUMMARY_QUEUE = "1"` in [vars] above to start enqueueing
# Until activated, the producer Worker logs "queue disabled" and skips the
# enqueue step. See docs/06-worker-split-design.md.
[[queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "tech-dashboard-summary"

[observability]
enabled = true

# Cron runs are billed against the Workers Paid plan limits.
# Expected monthly usage: 4 runs/day * 30 days = ~120 runs/month.
# CPU budget per run: ~5-30s (mostly fetch waits, not CPU).
[placement]
mode = "smart"
