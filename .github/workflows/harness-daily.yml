name: Daily Harness

on:
  schedule:
    # Every 6 hours: 00:00 / 06:00 / 12:00 / 18:00 JST
    - cron: "0 15,21,3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: harness-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install harness deps
        run: npm ci

      - name: Run collector
        env:
          # Copilot Enterprise の PAT (classic) を Secrets に登録しておく。
          # PAT → 一時トークンの交換は summarize.ts が自動で行う。
          COPILOT_PAT: ${{ secrets.COPILOT_PAT }}
          SUMMARIZE_MODEL: ${{ vars.SUMMARIZE_MODEL || 'claude-opus-4.7' }}
          SUMMARIZE_MAX_NEW: "25"
        run: npm run collect

      - name: Commit data/index.json if changed
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "tech-dashboard-bot"
            git config user.email "bot@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): auto-update index"
            git push
          else
            echo "No data changes."
          fi
