#:schema https://cloudflare.com/workers/wrangler-schema.json
# tech-dashboard-summarizer — Queue consumer Worker.
#
# Receives one entry per invocation from the SUMMARY_QUEUE producer Worker
# (tech-dashboard-harness), calls Copilot to generate the bilingual JSON
# summary, and writes the result to the SUMMARY_CACHE KV namespace.
#
# Split out from the harness Worker because the combined CPU cost of
# (long-form Copilot JSON parse) + (publishHistoryFiles JSON aggregation)
# exceeded the Standard plan's 30s per-invocation CPU cap (LL-037).
# Per-message invocation gives each summarize its own 30s budget.

name = "tech-dashboard-summarizer"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# KV: same SUMMARY_CACHE as the harness Worker. Both bind to namespace id
# 6d67debb991742efadfec473a121f5fc.
[[kv_namespaces]]
binding = "SUMMARY_CACHE"
id = "6d67debb991742efadfec473a121f5fc"

[vars]
SUMMARIZE_MODEL = "claude-sonnet-4.6"
# 28s leaves ~2s budget for KV write + JSON parse within the 30s CPU cap.
# Originally 25s but anthropic long-form entries timed out occasionally.
SUMMARIZE_TIMEOUT_MS = "28000"
# Keep in sync with the compact Queue prompt in worker/src/prompt.ts. This is
# intentionally lower than local backfill scripts; the Queue consumer must
# finish and close valid JSON inside one Worker invocation.
SUMMARIZE_MAX_TOKENS = "1600"

# Secrets (set via `wrangler secret put --name tech-dashboard-summarizer`):
#   - COPILOT_PAT    Classic PAT with Copilot Enterprise access

# Queue consumer. Process one entry per invocation so each summarize gets
# its own CPU budget; Cloudflare auto-retries on throw (up to max_retries).
# max_concurrency caps how many invocations run at once. Without it,
# Cloudflare auto-scales to 40+ which fan-outs simultaneous Copilot API
# calls and causes upstream rate-limiting (every request AbortError).
# 2 keeps Copilot happy and still drains ~250 messages/h at ~15-25s/msg.
[[queues.consumers]]
queue = "tech-dashboard-summary"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
# Back off timed-out Copilot calls instead of retrying immediately into the
# same upstream pressure window.
retry_delay = 120
max_concurrency = 2
dead_letter_queue = "tech-dashboard-summary-dlq"

[observability]
enabled = true
