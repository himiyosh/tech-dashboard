name: Worker Health

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_run:
    workflows: ["Publisher"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: worker-health
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-health:
    name: production freshness and deploy health
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check publisher and Cloudflare enrichment health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_DEPLOY_WAIT_MS: ${{ github.event_name == 'workflow_run' && '900000' || '0' }}
        run: npm run health:prod
