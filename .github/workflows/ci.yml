name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

# 同一ブランチで push が連発した場合は古い run をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: feature → develop → main branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # check-approval-authorship.mjs walks history for the manifest.
          fetch-depth: 0

      - name: Enforce integration and release PR branches
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/check-pr-branch-flow.mjs

      - name: Enforce human authorship of the publication approval manifest
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-approval-authorship.mjs "$PR_BASE_SHA..HEAD"

  data-snapshot:
    name: pin immutable main data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.prepare.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Capture current main data for non-main CI
        id: prepare
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-current-data.mjs prepare "$RUNNER_TEMP/ci-main-snapshot" "$CI_BASE_SHA"

      - name: Upload pinned data snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: ci-main-data-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-main-snapshot/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  unit:
    name: unit + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: data-snapshot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Download pinned data snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        uses: actions/download-artifact@v4
        with:
          name: ci-main-data-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-main-snapshot

      - name: Hydrate pinned data for unit tests
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        env:
          CI_MAIN_SHA: ${{ needs.data-snapshot.outputs.main_sha }}
        run: node scripts/ci-current-data.mjs apply "$RUNNER_TEMP/ci-main-snapshot" "$CI_MAIN_SHA"

      - name: Install root deps
        run: npm ci

      - name: Install Worker deps
        run: npm --prefix worker ci

      - name: Dependency audit (root)
        continue-on-error: true
        run: npm run audit:root

      - name: Install web deps
        # tests/web-data.test.ts imports web/src/lib/data.ts; vite/oxc walks up
        # to web/tsconfig.json which extends astro/tsconfigs/strict (only
        # available after `npm ci` inside web/).
        run: npm --prefix web ci

      - name: Dependency audit (web)
        continue-on-error: true
        run: npm run audit:web

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (Worker and publisher runner)
        run: npm run typecheck:worker

      - name: Unit tests (Vitest)
        run: npm test

  web-build:
    name: web build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: data-snapshot
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Download pinned data snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        uses: actions/download-artifact@v4
        with:
          name: ci-main-data-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-main-snapshot

      - name: Hydrate pinned data for Web build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        env:
          CI_MAIN_SHA: ${{ needs.data-snapshot.outputs.main_sha }}
        run: node scripts/ci-current-data.mjs apply "$RUNNER_TEMP/ci-main-snapshot" "$CI_MAIN_SHA"

      - name: Install web deps
        run: npm --prefix web ci

      - name: Web build (Cloudflare Pages parity)
        run: npm run build:web

      - name: Upload verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: [unit, web-build, data-snapshot]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Download pinned data snapshot
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        uses: actions/download-artifact@v4
        with:
          name: ci-main-data-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-main-snapshot

      - name: Hydrate pinned data for E2E
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
        env:
          CI_MAIN_SHA: ${{ needs.data-snapshot.outputs.main_sha }}
        run: node scripts/ci-current-data.mjs apply "$RUNNER_TEMP/ci-main-snapshot" "$CI_MAIN_SHA"

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm --prefix web ci

      - name: Download verified Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
