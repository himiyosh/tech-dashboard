name: Publisher
run-name: Publisher / ${{ github.event_name == 'schedule' && github.event.schedule == '17 2 * * *' && 'reconcile' || github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || github.event_name == 'workflow_dispatch' && inputs.full_reconcile && 'reconcile' || 'publish' }}

on:
  schedule:
    - cron: "0 * * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Prepare and compare data without writes, queue sends, or push
        type: boolean
        default: false
      full_reconcile:
        description: Run the full Astro, Pagefind, and Publisher E2E reconciliation
        type: boolean
        default: true
      incremental_shadow:
        description: Publish a detail-only R2/D1 shadow snapshot after full reconciliation
        type: boolean
        default: false

concurrency:
  group: tech-dashboard-publisher
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: collect, verify, and publish data
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PUBLISHER_BRIDGE_URL: https://tech-dashboard-harness.himiyosh.workers.dev
      PUBLISHER_OIDC_AUDIENCE: tech-dashboard-publisher
      PUBLISHER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      PUBLISHER_FULL_RECONCILE: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.full_reconcile && !inputs.dry_run) }}
      PUBLISHER_INCREMENTAL_SHADOW: ${{ github.event_name == 'workflow_dispatch' && inputs.incremental_shadow && inputs.full_reconcile && !inputs.dry_run }}
      INCREMENTAL_SHADOW_URL: ${{ vars.INCREMENTAL_SHADOW_URL }}
      INCREMENTAL_MEASURED_DAILY_REQUESTS: ${{ vars.INCREMENTAL_MEASURED_DAILY_REQUESTS }}
      INCREMENTAL_TRAFFIC_VERIFIED_AT: ${{ vars.INCREMENTAL_TRAFFIC_VERIFIED_AT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Confirm clean checkout
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Prepare publisher output
        id: publisher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mode="--apply"
          if [ "${PUBLISHER_DRY_RUN}" = "true" ]; then
            mode="--dry-run"
          fi
          npm run publisher:run -- "${mode}"

      - name: Summarize incremental route impact
        if: steps.publisher.outputs.changed == 'true'
        env:
          IMPACT_PATH: ${{ steps.publisher.outputs.impact_path }}
        run: node --import tsx scripts/publisher-impact.ts --report "${IMPACT_PATH}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Install incremental verification dependencies
        if: steps.publisher.outputs.changed == 'true' && env.PUBLISHER_DRY_RUN != 'true' && env.PUBLISHER_FULL_RECONCILE != 'true'
        run: npm --prefix web ci

      - name: Verify incremental data and invalidation plan
        if: steps.publisher.outputs.changed == 'true' && env.PUBLISHER_DRY_RUN != 'true' && env.PUBLISHER_FULL_RECONCILE != 'true'
        run: |
          npm run secrets:scan
          npm test -- tests/data-schema.test.ts tests/publisher-impact.test.ts tests/publisher-runner.test.ts
          git diff --check -- data

      - name: Install full reconciliation dependencies
        if: env.PUBLISHER_FULL_RECONCILE == 'true' && env.PUBLISHER_DRY_RUN != 'true'
        run: |
          npm --prefix worker ci
          npm --prefix web ci
          npx playwright install --with-deps chromium

      - name: Run full static reconciliation
        if: env.PUBLISHER_FULL_RECONCILE == 'true' && env.PUBLISHER_DRY_RUN != 'true'
        env:
          # The preceding build is the exact artifact under verification.
          # Rebuilding in Playwright doubles the static-generation cost and can
          # exhaust the Publisher runner before tests begin.
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: |
          npm run secrets:scan
          npm run typecheck
          npm run typecheck:worker
          npm test
          npm run build:web
          npm run test:e2e:publisher
          git diff --check -- data

      - name: Prepare detail-only incremental shadow snapshot
        id: incremental-shadow
        if: env.PUBLISHER_INCREMENTAL_SHADOW == 'true'
        env:
          EXPECTED_PARENT: ${{ steps.publisher.outputs.expected_parent }}
        run: |
          test "${PUBLISHER_FULL_RECONCILE}" = "true"
          test -n "${INCREMENTAL_SHADOW_URL}"
          shell_path="${RUNNER_TEMP}/incremental-detail-shell.json"
          bundle_dir="${RUNNER_TEMP}/incremental-shadow-bundle"
          npm run incremental:shadow -- \
            --capture-shell \
            --dist web/dist \
            --output "${shell_path}"
          npm run incremental:shadow -- \
            --render \
            --base-ref "${EXPECTED_PARENT}" \
            --shell "${shell_path}" \
            --output "${bundle_dir}" \
            --full-detail-snapshot
          npm run incremental:shadow -- \
            --verify-parity \
            --bundle "${bundle_dir}/bundle.json" \
            --dist web/dist
          echo "bundle_path=${bundle_dir}/bundle.json" >> "${GITHUB_OUTPUT}"

      - name: Commit and push verified data
        id: publish
        if: steps.publisher.outputs.changed == 'true' && env.PUBLISHER_DRY_RUN != 'true'
        env:
          EXPECTED_PARENT: ${{ steps.publisher.outputs.expected_parent }}
          FILES_JSON: ${{ steps.publisher.outputs.files_json }}
          MESSAGE_BASE64: ${{ steps.publisher.outputs.message_base64 }}
        run: |
          echo "published=false" >> "${GITHUB_OUTPUT}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_PARENT}"
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "${EXPECTED_PARENT}" ]; then
            echo "::warning::main advanced during publisher verification; the next scheduled run will retry"
            exit 0
          fi

          node -e 'for (const file of JSON.parse(process.env.FILES_JSON)) process.stdout.write(file + "\0")' | xargs -0 git add --
          test -z "$(git diff --name-only -- data)"
          test -z "$(git diff --cached --name-only | grep -Ev '^data/(index|bodies|stats)\.json$|^data/archive/(_index|[0-9]{4}-[0-9]{2})\.json$' || true)"
          test -n "$(git diff --cached --name-only)"
          npm run publisher:run -- --preflight

          message="$(node -e 'process.stdout.write(Buffer.from(process.env.MESSAGE_BASE64, "base64").toString("utf8"))')"
          git config user.name "tech-dashboard-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "${message}"

          if ! git push origin HEAD:main; then
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" != "${EXPECTED_PARENT}" ]; then
              echo "::warning::main advanced before push; the next scheduled run will retry"
              exit 0
            fi
            exit 1
          fi
          echo "published=true" >> "${GITHUB_OUTPUT}"

      - name: Flush verified Queue and KV effects
        if: >-
          steps.publisher.outputs.effects_count != '0' &&
          env.PUBLISHER_DRY_RUN != 'true' &&
          (steps.publisher.outputs.changed != 'true' || steps.publish.outputs.published == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EFFECTS_PATH: ${{ steps.publisher.outputs.effects_path }}
        run: npm run publisher:run -- --flush "${EFFECTS_PATH}"

      - name: Publish verified incremental shadow snapshot
        if: >-
          env.PUBLISHER_INCREMENTAL_SHADOW == 'true' &&
          (steps.publisher.outputs.changed != 'true' || steps.publish.outputs.published == 'true')
        env:
          BUNDLE_PATH: ${{ steps.incremental-shadow.outputs.bundle_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          INCREMENTAL_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            npm run incremental:shadow:publish -- --publish "${BUNDLE_PATH}"
