<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="url(#bg)" />
  <!-- outer radar arc -->
  <path d="M7 16a9 9 0 0 1 9-9" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />
  <!-- middle radar arc -->
  <path d="M11 16a5 5 0 0 1 5-5" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" opacity="0.85" />
  <!-- sweep line -->
  <path d="M16 16 L24 8" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round" />
  <!-- center pulse dot -->
  <circle cx="16" cy="16" r="2.4" fill="#5eead4" />
  <circle cx="16" cy="16" r="4.2" stroke="#5eead4" stroke-width="0.8" opacity="0.35" />
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1f1d" />
      <stop offset="1" stop-color="#0f3f3c" />
    </linearGradient>
  </defs>
</svg>
