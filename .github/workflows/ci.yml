name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

# 同一ブランチで push が連発した場合は古い run をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: feature → develop → main branch flow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Enforce integration and release PR branches
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: node scripts/check-pr-branch-flow.mjs

  unit:
    name: unit + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install Worker deps
        run: npm --prefix worker ci

      - name: Dependency audit (root)
        continue-on-error: true
        run: npm run audit:root

      - name: Install web deps
        # tests/web-data.test.ts imports web/src/lib/data.ts; vite/oxc walks up
        # to web/tsconfig.json which extends astro/tsconfigs/strict (only
        # available after `npm ci` inside web/).
        run: npm --prefix web ci

      - name: Dependency audit (web)
        continue-on-error: true
        run: npm run audit:web

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (Worker and publisher runner)
        run: npm run typecheck:worker

      - name: Unit tests (Vitest)
        run: npm test

  web-build:
    name: web build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm --prefix web ci

      - name: Web build (Cloudflare Pages parity)
        run: npm run build:web

      - name: Upload verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: [unit, web-build]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm --prefix web ci

      - name: Download verified Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
