name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで push が連発した場合は古い run をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + typecheck + web build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install Worker deps
        run: npm --prefix worker ci

      - name: Dependency audit (root)
        continue-on-error: true
        run: npm run audit:root

      - name: Install web deps
        # tests/web-data.test.ts imports web/src/lib/data.ts; vite/oxc walks up
        # to web/tsconfig.json which extends astro/tsconfigs/strict (only
        # available after `npm ci` inside web/).
        run: npm --prefix web ci

      - name: Dependency audit (web)
        continue-on-error: true
        run: npm run audit:web

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (Worker and publisher runner)
        run: npm run typecheck:worker

      - name: Unit tests (Vitest)
        run: npm test

      - name: Web build (Cloudflare Pages parity)
        run: npm run build:web

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm --prefix web ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
