#:schema https://cloudflare.com/workers/wrangler-schema.json
# tech-dashboard-summarizer — Queue consumer Worker.
#
# Receives one entry per invocation from the SUMMARY_QUEUE producer Worker
# (tech-dashboard-harness), calls Copilot to generate the bilingual JSON
# summary, and writes the result to the SUMMARY_CACHE KV namespace.
#
# Split out from the harness Worker because the combined CPU cost of
# (long-form Copilot JSON parse) + (publishHistoryFiles JSON aggregation)
# exceeded the default 30s per-invocation CPU cap (LL-037). The summarizer is
# intentionally quality-first: one queue message gets a longer timeout and
# output budget so the site can publish article-like summaries instead of thin
# notes. CPU limits are intentionally omitted because the current Cloudflare
# plan rejects per-Worker cpu_ms settings.

name = "tech-dashboard-summarizer"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# KV: same SUMMARY_CACHE as the harness Worker. Both bind to namespace id
# 6d67debb991742efadfec473a121f5fc.
[[kv_namespaces]]
binding = "SUMMARY_CACHE"
id = "6d67debb991742efadfec473a121f5fc"

[vars]
# GPT-5.6 Sol Fast first, per site-owner priority (2026-08-29). Smoke-tested
# against the production prompt on all four gpt-5.6 variants and real corpus
# entries: 16/16 parse+grounding pass, natural Japanese, 3.6-12.7s per call
# (R-007 / LL-010 small-batch gate). These models are /responses-only and the
# worker routes them there (worker/src/copilot-client.ts); claude-sonnet-4.6
# stays last in the chain as the battle-tested safety net on /chat/completions.
SUMMARIZE_MODEL = "gpt-5.6-sol-fast"
SUMMARIZE_MODEL_FALLBACKS = "gpt-5.6-sol,gpt-5.6-terra,gpt-5.6-luna,claude-sonnet-4.6"
# Summary-only generation normally completes well below one minute. Bound each
# attempt so a malformed or stalled response releases the queue slot quickly.
SUMMARIZE_TIMEOUT_MS = "60000"
# The response contract is titleJa + summaryJa + summaryEn only. Keeping the
# budget compact avoids reasoning-token exhaustion and increases queue turnover.
SUMMARIZE_MAX_TOKENS = "1600"

# Secrets (set via `wrangler secret put --name tech-dashboard-summarizer`):
#   - COPILOT_PAT    Classic PAT with Copilot Enterprise access

# Queue consumer. Process one entry per invocation so each summarize gets
# its own CPU budget; Cloudflare auto-retries on throw (up to max_retries).
# max_concurrency caps how many invocations run at once. Without it,
# Cloudflare auto-scales to 40+ which fan-outs simultaneous Copilot API
# calls and causes upstream rate-limiting (every request AbortError).
# 2 keeps Copilot pressure moderate while allowing slow, high-quality jobs to
# drain in parallel. Lower to 1 if Copilot starts rate-limiting long requests.
[[queues.consumers]]
queue = "tech-dashboard-summary"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 2
# Back off timed-out Copilot calls instead of retrying immediately into the
# same upstream pressure window.
retry_delay = 120
max_concurrency = 2
dead_letter_queue = "tech-dashboard-summary-dlq"

[observability]
enabled = true
