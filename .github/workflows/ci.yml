name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一ブランチで push が連発した場合は古い run をキャンセル
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independent-review:
    name: exact-head independent review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enforce exact-head independent review
        if: github.event_name == 'pull_request' && github.event.pull_request.state == 'open'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGER_SESSION_ID: ${{ vars.INDEPENDENT_REVIEW_MERGER_SESSION_ID }}
          REVIEWER_SESSION_ID: ${{ vars.INDEPENDENT_REVIEW_REVIEWER_SESSION_ID }}
        run: |
          CURRENT_PR_STATE="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state'
          )"
          case "$CURRENT_PR_STATE" in
            closed)
              echo "SKIP: pull request $PR_NUMBER is already closed"
              exit 0
              ;;
            open)
              ;;
            *)
              echo "ERR: unexpected current pull request state: $CURRENT_PR_STATE"
              exit 1
              ;;
          esac
          npm run check:independent-review -- \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head "$PR_HEAD_SHA" \
            --merger-session "$MERGER_SESSION_ID" \
            --reviewer-session "$REVIEWER_SESSION_ID"

  unit:
    name: unit + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install Worker deps
        run: npm --prefix worker ci

      - name: Dependency audit (root)
        continue-on-error: true
        run: npm run audit:root

      - name: Install web deps
        # tests/web-data.test.ts imports web/src/lib/data.ts; vite/oxc walks up
        # to web/tsconfig.json which extends astro/tsconfigs/strict (only
        # available after `npm ci` inside web/).
        run: npm --prefix web ci

      - name: Dependency audit (web)
        continue-on-error: true
        run: npm run audit:web

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (Worker and publisher runner)
        run: npm run typecheck:worker

      - name: Unit tests (Vitest)
        run: npm test

  web-build:
    name: web build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm --prefix web ci

      - name: Web build (Cloudflare Pages parity)
        run: npm run build:web

      - name: Upload verified Web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    needs: [unit, web-build]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm --prefix web ci

      - name: Download verified Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.run_id }}
          path: web/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          PLAYWRIGHT_REUSE_BUILD: "1"
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
