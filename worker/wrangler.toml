#:schema https://cloudflare.com/workers/wrangler-schema.json
# Free-plan bridge for the GitHub Actions publisher. Heavy collection, JSON
# processing, validation, and Git publication run in .github/workflows/publisher.yml.
# This Worker only verifies GitHub OIDC and forwards bounded KV/Queue operations.

name = "tech-dashboard-harness"
main = "src/free-plan-bridge.ts"
compatibility_date = "2025-09-01"

[[kv_namespaces]]
binding = "SUMMARY_CACHE"
id = "6d67debb991742efadfec473a121f5fc"

[[queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "tech-dashboard-summary"

[[queues.producers]]
binding = "BODY_QUEUE"
queue = "tech-dashboard-body"

[vars]
PUBLISHER_OIDC_AUDIENCE = "tech-dashboard-publisher"
PUBLISHER_REPOSITORY = "himiyosh/tech-dashboard"
PUBLISHER_WORKFLOW_REF = "himiyosh/tech-dashboard/.github/workflows/publisher.yml@refs/heads/main"

[observability]
enabled = true
